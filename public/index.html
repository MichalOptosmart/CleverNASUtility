<!doctype html><meta charset="utf-8"><title>Clever NAS Utility</title><style>body{font:16px system-ui;max-width:1100px;margin:2rem auto}input{width:40%;padding:.6rem}button{padding:.5rem;margin:.2rem}pre{white-space:pre-wrap;background:#f3f3f3;padding:1rem}</style><h1>Clever NAS Utility</h1><p>Append-only kopírování. Existující rozdílné soubory se automaticky přeskočí a objeví se ve frontě konfliktů.</p><input id=s placeholder="Zdroj /mnt/GIT/DATA/share/..."> <input id=t placeholder="Cíl /mnt/Data/Share/share/..."> <button onclick=start()>Spustit kopírování</button><h2>Konflikty</h2><div id=c></div><h2>Historie</h2><pre id=h>Načítám…</pre><script>async function load(){h.textContent=JSON.stringify(await(await fetch('/api/history')).json(),null,2);let a=await(await fetch('/api/conflicts')).json();c.innerHTML=a.map(x=>`<p><b>${x.path}</b> (${x.sourceSize} → ${x.targetSize}) <button onclick="decide('${x.id}','overwrite')">Přepsat</button><button onclick="decide('${x.id}','accept')">Považovat za zkopírovaný</button><button onclick="decide('${x.id}','defer')">Odložit</button></p>`).join('')||'Žádné čekající konflikty.'}async function decide(id,decision){await fetch('/api/conflicts/'+id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({decision})});load()}async function start(){let r=await fetch('/api/copy',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({source:s.value,target:t.value})});alert((await r.json()).id||'Chyba');load()}load();setInterval(load,5000)</script>
