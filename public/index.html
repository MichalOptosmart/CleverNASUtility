<!doctype html><meta charset="utf-8"><title>Clever NAS Utility</title><style>body{font:16px system-ui;max-width:1100px;margin:2rem auto}input{padding:.6rem;margin:.2rem;width:38%}button{padding:.5rem;margin:.2rem}pre{white-space:pre-wrap;background:#f3f3f3;padding:1rem}</style><h1>Clever NAS Utility</h1><section id=login><input id=k placeholder="API klíč (při prvním nastavení)"><input id=u placeholder="Uživatelské jméno"><input id=p type=password placeholder="Heslo"><button onclick=login()>Přihlásit / nastavit</button></section><section id=app hidden><p>Append-only kopírování; existující rozdílné soubory se zařadí do fronty.</p><div>Zdroj: <input id=s placeholder="/mnt/GIT/DATA/share/..."> <button onclick="browse('s')">Procházet</button></div><div>Cíl: <input id=t placeholder="/mnt/Data/Share/share/..."> <button onclick="browse('t')">Procházet</button></div><div id=browser hidden></div><button onclick=start()>Spustit kopírování</button><h2>Konflikty</h2><div id=c></div><h2>Historie</h2><pre id=h></pre></section><script>async function login(){let r=await fetch('/api/setup',{method:'POST',headers:{'content-type':'application/json','x-api-key':k.value},body:JSON.stringify({username:u.value,password:p.value,apiKey:k.value})});if(r.status===428||r.status===409)r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});if(r.ok){login.hidden=true;app.hidden=false;load()}else alert('Přihlášení k TrueNAS se nezdařilo')}async function browse(target){let p=prompt('Cesta ke složce (prázdné = /mnt)', target==='s'?s.value:t.value);if(p===null)return;let r=await fetch('/api/browse?path='+encodeURIComponent(p||'/mnt'));if(!r.ok)return alert('Složku nelze načíst');let x=await r.json(),v=prompt('Vyber cestu ze seznamu:\n'+x.dirs.join('\n'),p||'/mnt');if(v){if(target==='s')s.value=v;else t.value=v}}async function load(){let [a,b]=await Promise.all([fetch('/api/history'),fetch('/api/conflicts')]);if(a.status===401)return;h.textContent=JSON.stringify(await a.json(),null,2);let x=await b.json();c.innerHTML=x.map(v=>`<p><b>${v.path}</b> (${v.sourceSize} → ${v.targetSize}) <button onclick="decide('${v.id}','overwrite')">Přepsat</button><button onclick="decide('${v.id}','accept')">Považovat za zkopírovaný</button><button onclick="decide('${v.id}','defer')">Odložit</button></p>`).join('')||'Žádné čekající konflikty.'}async function decide(id,decision){await fetch('/api/conflicts/'+id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({decision})});load()}async function start(){let r=await fetch('/api/copy',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({source:s.value,target:t.value})});alert((await r.json()).id||'Chyba');load()}</script>
