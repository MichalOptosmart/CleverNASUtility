<!doctype html><meta charset="utf-8"><title>Clever NAS Utility</title><style>body{font:16px system-ui;max-width:1000px;margin:2rem auto}input{width:42%;padding:.6rem}button{padding:.6rem 1rem}pre{white-space:pre-wrap;background:#f3f3f3;padding:1rem}</style><h1>Clever NAS Utility</h1><p>Append-only kopírování. Zdroj ani existující cílové soubory se nemažou ani nepřepisují.</p><input id=s placeholder="Zdroj /mnt/GIT/DATA/share/..."> <input id=t placeholder="Cíl /mnt/Data/Share/share/..."> <button onclick=start()>Spustit kopírování</button><h2>Historie</h2><pre id=h>Načítám…</pre><script>async function load(){h.textContent=JSON.stringify(await (await fetch('/api/history')).json(),null,2)}async function start(){let r=await fetch('/api/copy',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({source:s.value,target:t.value})});alert((await r.json()).id||'Chyba');load()}load();setInterval(load,3000)</script>
